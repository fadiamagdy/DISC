<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار DISC</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f6f8;
    color:#202124
}

.container{
    max-width:900px;
    margin:0 auto;
    padding:20px
}

.hero{
    background:#fff;
    border-radius:18px;
    padding:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    margin-bottom:18px;
    text-align:center
}

h1{
    margin:0 0 10px;
    font-size:30px
}

.intro{
    line-height:1.8;
    color:#555;
    margin:0
}

.progress{
    margin-top:15px;
    font-weight:bold
}

.group{
    background:#fff;
    border-radius:16px;
    padding:18px;
    margin:14px 0;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    border-right:7px solid #ddd
}

.group.yellow{
    border-right-color:#e5c400
}

.group.white{
    border-right-color:#777
}

.group h2{
    font-size:19px;
    margin:0 0 14px
}

.option{
    display:block;
    cursor:pointer;
    margin:9px 0
}

.option input{
    position:absolute;
    opacity:0
}

.option span{
    display:block;
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:12px;
    padding:13px 15px;
    transition:.15s
}

.option input:checked+span{
    background:#fff6a8;
    border-color:#d4b900;
    font-weight:bold
}

.option span:hover{
    background:#f1f3f4
}

.error{
    display:none;
    background:#fde8e8;
    color:#b42318;
    padding:12px;
    border-radius:10px;
    margin:15px 0;
    font-weight:bold
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:#222;
    color:#fff
}

button:hover{
    opacity:.9
}

#result{
    display:none;
    background:#fff;
    border-radius:18px;
    padding:24px;
    margin-top:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08)
}

.scores{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:18px 0
}

.score{
    padding:16px;
    border:1px solid #ddd;
    border-radius:12px;
    text-align:center
}

.score b{
    display:block;
    font-size:27px;
    margin-bottom:4px
}

.neutral{
    margin-top:10px;
    text-align:center;
    color:#666
}

.restart{
    margin-top:15px;
    background:#666
}

.profile{
    margin-top:16px;
    text-align:center;
    border:1px solid #ddd;
    border-radius:12px;
    padding:18px;
    background:#fafafa
}

.profile-code{
    font-size:38px;
    font-weight:bold
}

.profile-name{
    font-size:23px;
    font-weight:bold;
    margin:4px 0
}

.profile-desc{
    color:#555;
    line-height:1.8
}

.rule{
    margin-top:12px;
    font-size:14px;
    color:#666;
    background:#f1f3f4;
    border-radius:10px;
    padding:10px
}

@media(max-width:600px){
    .container{
        padding:12px
    }

    h1{
        font-size:25px
    }

    .scores{
        grid-template-columns:repeat(2,1fr)
    }
}
</style>
</head>

<body>

<div class="container">

<section class="hero">

<h1>اختبار DISC</h1>

<p class="intro">
في كل مجموعة اختار العبارة التي تشبهك أكثر.
</p>

<p class="intro">
يجب اختيار إجابة واحدة في كل مجموعة.
</p>

<div class="progress" id="progress">
تمت الإجابة على 0 من 24
</div>

</section>

<form id="discForm"></form>

<div class="error" id="error"></div>

<button type="button" id="submitBtn">
إظهار النتيجة
</button>

<section id="result">

<h2>نتيجتك</h2>

<div class="scores">

<div class="score">
<b id="dScore">0</b>
D
</div>

<div class="score">
<b id="iScore">0</b>
I
</div>

<div class="score">
<b id="sScore">0</b>
S
</div>

<div class="score">
<b id="cScore">0</b>
C
</div>

</div>

<p class="neutral">
الاختيارات المحايدة:
<strong id="neutralScore">0</strong>
</p>

<div class="profile">

<div class="profile-code" id="profileCode"></div>

<div class="profile-name" id="profileName"></div>

<div class="profile-desc" id="profileDesc"></div>

<div class="rule">
إذا حصل أحد الأنماط على 17 اختيارًا أو أكثر من 24
(أكثر من 70%) تكون النتيجة مزدوجة مثل
DD أو II أو SS أو CC.
</div>

</div>

<button type="button" class="restart" onclick="location.reload()">
إعادة الاختبار
</button>

</section>

</div>

<script>

]

options:[

{text:"يسعي للتغيير، يسعي لتحقيقه",number:1},

]
},

{
side:"right",
options:[

{text:"يستمتع بالاهتمام، يحب الفرص الجديدة",number:2},
{text:"يتجنب الصراع، مسترخي",number:3},

]
},

{
side:"left",
options:[
{text:"مندفع، عاطفي",number:2},
{text:"متحفظ، مُغرق في التفاصيل",number:4},

]

{

options:[

{text:"معاييه عالية، ينظر إلى الأفضل",number:4}

}

];

const profiles = {

"DD":{
name:"القائد الحاسم",
description:"شخص شديد الحسم والطموح، يحب الإنجاز السريع والسيطرة على الموقف، ويتحدى العقبات بثقة."
},

"DI":{
name:"القائد الملهم",
description:"شخص حاسم ومؤثر، يجمع بين الجرأة والقدرة على تحفيز الآخرين وإشعال الحماس فيهم."
},

"DS":{
name:"القائد الداعم",
description:"شخص قوي وحاسم، لكنه يهتم بالاستقرار والناس، ويقود بطريقة عملية مع الحفاظ على ولاء الفريق."
},

"DC":{
name:"القائد التحليلي",
description:"شخص حاسم ومنطقي، يعتمد على الحقائق والتحليل للوصول إلى أفضل قرار وتحقيق النتائج."
},

"ID":{
name:"المؤثر الحاسم",
description:"شخص اجتماعي ومتحمس، يحب التأثير في الآخرين، لكنه يمتلك جرأة وحسمًا في اتخاذ المبادرة."
},

"II":{
name:"المؤثر الاجتماعي",
description:"شخص اجتماعي جدًا، متفائل ومتحمس، يحب التواصل والتأثير وبناء العلاقات وتشجيع الآخرين."
},

"IS":{
name:"الميسر الاجتماعي",
description:"شخص ودود ومؤثر، يهتم بالعلاقات وراحة الآخرين، ويتميز بقدرته على خلق جو من التعاون والألفة."
},

"IC":{
name:"المتحدث الذكي",

},

"SD":{
name:"الداعم الحازم",
description:"شخص هادئ ومتعاون، لكنه يستطيع أن يكون حازمًا عندما يتطلب الموقف ذلك، ويمكن الاعتماد عليه في المواقف الصعبة."
},

"SI":{
name:"الداعم الاجتماعي",
description:"شخص ودود ومحبوب، يهتم بمشاعر الآخرين وبناء العلاقات، ويحب مساعدة الناس وتشجيعهم."
},

description:"شخص ثابت وهادئ وصبور، يقدّر الأمان والاستقرار، ويحب العلاقات العميقة والبيئات المتوقعة."
},

name:"المنظم الهادئ",

},

"CD":{

},

"CI":{
name:"المفكر الإبداعي",

},

"CS":{

},

"CC":{
name:"المحلل الدقيق",
description:"شخص شديد الدقة والتحليل، يهتم بالمعايير والجودة والتفاصيل، ولا يحب اتخاذ القرارات قبل التأكد من المعلومات."
}

const numberToProfile = {
1:"D",
2:"I",
3:"S",
4:"C",
5:"Neutral"
};

const form = document.getElementById("discForm");

groups.forEach((group,i)=>{

    const card = document.createElement("section");

    card.className =
        "group " +
        (group.side==="left" ? "yellow" : "white");

    card.id = "group-" + (i+1);

    const title = document.createElement("h2");

    title.textContent = "المجموعة " + (i+1);

    card.appendChild(title);

    group.options.forEach(opt=>{

        const label = document.createElement("label");

        label.className = "option";

        label.innerHTML = `
            <input
                type="radio"
                name="g${i+1}"
                value="${opt.number}">
            <span>${opt.text}</span>
        `;

        card.appendChild(label);

    });

    form.appendChild(card);

});

function updateProgress(){

    let n = 0;

    for(let i=1;i<=24;i++){

        if(
            document.querySelector(
                \`input[name="g\${i}"]:checked\`
            )
        ){
            n++;
        }

    }

    document.getElementById("progress").textContent =
        \`تمت الإجابة على \${n} من 24\`;
}

form.addEventListener("change",updateProgress);

document.getElementById("submitBtn")
.addEventListener("click",()=>{

    const error =
        document.getElementById("error");

    error.style.display="none";

    for(let i=1;i<=24;i++){

        if(
            !document.querySelector(
                \`input[name="g\${i}"]:checked\`
            )
        ){

            error.textContent =
                \`من فضلك اختاري إجابة في المجموعة \${i}.\`;

            error.style.display="block";

            document
                .getElementById("group-"+i)
                .scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            return;
        }

    }

    const scores = {
        D:0,
        I:0,
        S:0,
        C:0,
        Neutral:0
    };

    for(let i=1;i<=24;i++){

        const value =
            Number(
                document.querySelector(
                    \`input[name="g\${i}"]:checked\`
                ).value
            );

        scores[
            numberToProfile[value]
        ]++;

    }

    dScore.textContent = scores.D;
    iScore.textContent = scores.I;
    sScore.textContent = scores.S;
    cScore.textContent = scores.C;
    neutralScore.textContent = scores.Neutral;

    const letters = ["D","I","S","C"];

    /*
       أكثر من 70% من 24
       = 16.8
       لذلك الحد الأدنى هو 17
    */

    const doubleLetter =
        letters.find(
            letter => scores[letter] >= 17
        );

    let code;

    if(doubleLetter){

        code =
            doubleLetter +
            doubleLetter;

    }else{

        const ranked =
            [...letters].sort(
                (a,b)=>
                    scores[b]-scores[a] ||
                    letters.indexOf(a)-
                    letters.indexOf(b)
            );

        code =
            ranked[0] +
            ranked[1];

    }

    const profile =
        profiles[code];

    profileCode.textContent =
        code;

    profileName.textContent =
        profile.name;

    profileDesc.textContent =
        profile.description;

    document.getElementById("result")
        .style.display="block";

    document.getElementById("result")
        .scrollIntoView({
            behavior:"smooth"
        });

});

updateProgress();

</script>

</html>
