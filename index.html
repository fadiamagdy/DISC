<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار DISC</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;color:#202124}
  .container{max-width:900px;margin:0 auto;padding:20px}
  .hero{background:#fff;border-radius:18px;padding:25px;box-shadow:0 3px 15px rgba(0,0,0,.08);margin-bottom:18px;text-align:center}
  h1{margin:0 0 10px;font-size:30px}
  .intro{line-height:1.8;color:#555;margin:0}
  .progress{margin-top:15px;font-weight:bold}
  .group{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06);border-right:7px solid #ddd}
  .group.yellow{border-right-color:#e5c400}
  .group.white{border-right-color:#777}
  .group h2{font-size:19px;margin:0 0 14px}
  .option{display:block;cursor:pointer;margin:9px 0}
  .option input{position:absolute;opacity:0}
  .option span{display:block;background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:13px 15px;transition:.15s}
  .option input:checked + span{background:#fff6a8;border-color:#d4b900;font-weight:bold}
  .option span:hover{background:#f1f3f4}
  .error{display:none;background:#fde8e8;color:#b42318;padding:12px;border-radius:10px;margin:15px 0;font-weight:bold}
  button{width:100%;border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:bold;cursor:pointer;background:#222;color:#fff}
  button:hover{opacity:.9}
  #result{display:none;background:#fff;border-radius:18px;padding:24px;margin-top:20px;box-shadow:0 3px 15px rgba(0,0,0,.08)}
  .scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
  .score{padding:16px;border:1px solid #ddd;border-radius:12px;text-align:center}
  .score b{display:block;font-size:27px;margin-bottom:4px}
  .neutral{margin-top:10px;text-align:center;color:#666}
  .restart{margin-top:15px;background:#666}
  @media(max-width:600px){
    .container{padding:12px}
    h1{font-size:25px}
    .scores{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <h1>اختبار DISC</h1>
    <p class="intro">في كل مجموعة اختاري العبارة التي تشبهك أكثر.</p>
    <p class="intro">يجب اختيار إجابة واحدة في كل مجموعة.</p>
    <div class="progress" id="progress">تمت الإجابة على 0 من 24</div>
  </section>

  <form id="discForm"></form>
  <div class="error" id="error"></div>
  <button type="button" id="submitBtn">إظهار النتيجة</button>

  <section id="result">
    <h2>نتيجتك</h2>
    <div class="scores">
      <div class="score"><b id="dScore">0</b>D</div>
      <div class="score"><b id="iScore">0</b>I</div>
      <div class="score"><b id="sScore">0</b>S</div>
      <div class="score"><b id="cScore">0</b>C</div>
    </div>
    <p class="neutral">الاختيارات المحايدة: <strong id="neutralScore">0</strong></p>
    <h3 id="mainResult"></h3>
    <button type="button" class="restart" onclick="location.reload()">إعادة الاختبار</button>
  </section>
</div>

<script>
const groups = [{"side": "left", "options": [{"text": "واثق، متحمس", "number": 2}, {"text": "متسامح، محترم", "number": 4}, {"text": "شجاع، مغامر", "number": 5}, {"text": "ودود، متعاون", "number": 3}]}, {"side": "left", "options": [{"text": "مبتكر، ذو رؤية", "number": 1}, {"text": "متحفظ، كتوم", "number": 4}, {"text": "اجتماعي، ودود", "number": 5}, {"text": "مسالم، وسيط", "number": 3}]}, {"side": "left", "options": [{"text": "دقيق، منضبط", "number": 5}, {"text": "مركز، موجه نحو الهدف", "number": 1}, {"text": "لاعب فريق، متعاون", "number": 5}, {"text": "مشجع للآخرين، محفّز", "number": 2}]}, {"side": "left", "options": [{"text": "حساس، سريع الإحباط", "number": 4}, {"text": "يواجه المعارضة، صريح", "number": 1}, {"text": "راضٍ، يبقي مشاعره لنفسه", "number": 3}, {"text": "يحب أن يُسمع صوته", "number": 5}]}, {"side": "left", "options": [{"text": "يبحث عن التوازن، هادئ", "number": 3}, {"text": "متحدث لبق، كاريزمي", "number": 2}, {"text": "منظم، يتبع القواعد", "number": 5}, {"text": "سريع الخطى، نشيط", "number": 1}]}, {"side": "left", "options": [{"text": "منظم، يحسن إدارة الوقت", "number": 4}, {"text": "قلق، مستعجل", "number": 1}, {"text": "مصمم، مثابر", "number": 3}, {"text": "عاطفي، متهور", "number": 2}]}, {"side": "left", "options": [{"text": "بارد، غير مبالٍ", "number": 5}, {"text": "غير واقعي، مرهق", "number": 2}, {"text": "راضٍ بالروتين", "number": 3}, {"text": "فظ، متسلط", "number": 5}]}, {"side": "left", "options": [{"text": "محلل جيد", "number": 4}, {"text": "مستمع جيد", "number": 3}, {"text": "مشجع جيد", "number": 2}, {"text": "مفوض جيد", "number": 1}]}, {"side": "left", "options": [{"text": "حازم، مندفع", "number": 1}, {"text": "متفائل، كاريزمي", "number": 5}, {"text": "متعاون، يعمل بروح الفريق", "number": 5}, {"text": "الدقة مهمة، منضبط", "number": 4}]}, {"side": "left", "options": [{"text": "صبور، ينتظر الشراء", "number": 3}, {"text": "يشتري بدافع، حاسم", "number": 1}, {"text": "ينفق على ما يريد، أناني", "number": 2}, {"text": "قادر على الاستغناء، منضبط", "number": 5}]}, {"side": "left", "options": [{"text": "صارم، يريد الأشياء دقيقة", "number": 4}, {"text": "يمل من الروتين بسرعة", "number": 5}, {"text": "يبحث عن التغيير", "number": 1}, {"text": "ودود، يقدم اللطف", "number": 3}]}, {"side": "left", "options": [{"text": "متهور، عاطفي", "number": 2}, {"text": "محسوب، مثقل بالتفاصيل", "number": 4}, {"text": "متطلب، مسيطر", "number": 1}, {"text": "غير تصادمي، يمكن التنبؤ به", "number": 5}]}, {"side": "right", "options": [{"text": "عطوف، رقيق", "number": 2}, {"text": "بسيط، مطيع", "number": 5}, {"text": "حازم، يريد النتائج", "number": 1}, {"text": "راضٍ، ممتن", "number": 3}]}, {"side": "right", "options": [{"text": "لا يخاف، مستقل", "number": 1}, {"text": "متحفظ، حذر", "number": 4}, {"text": "متهور، يفتقر للحذر", "number": 2}, {"text": "طيب، ودي", "number": 3}]}, {"side": "right", "options": [{"text": "صاحب ضمير، يخطط للمستقبل", "number": 4}, {"text": "يسعى للاعتراف والتقدم", "number": 1}, {"text": "جريء، مغامر", "number": 2}, {"text": "جدير بالثقة، مستمع جيد", "number": 3}]}, {"side": "right", "options": [{"text": "القواعد مملة، قلق", "number": 2}, {"text": "يتحدى القواعد، جريء", "number": 5}, {"text": "يريد الأمان، حذر", "number": 3}, {"text": "يريد العدل، منصف", "number": 4}]}, {"side": "right", "options": [{"text": "يحب المكافآت، الإنجازات", "number": 1}, {"text": "يستمتع بالاجتماعات الاجتماعية", "number": 2}, {"text": "مثقف، يسعى للتعلم المستمر", "number": 5}, {"text": "يريد أن يكون آمناً، محميّاً", "number": 3}]}, {"side": "right", "options": [{"text": "حذر، محسوب", "number": 4}, {"text": "ثابت، دقيق", "number": 5}, {"text": "منفتح، حماسي", "number": 5}, {"text": "متحمس، مرح", "number": 1}]}, {"side": "right", "options": [{"text": "قابل للاشتعال، مبتهج", "number": 2}, {"text": "داعم، مدافع", "number": 3}, {"text": "ملتزم بالقوانين، دقيق", "number": 5}, {"text": "تنافسي، جدالي", "number": 1}]}, {"side": "right", "options": [{"text": "سأجمع الحقائق", "number": 4}, {"text": "سأنجز العمل", "number": 3}, {"text": "سأقودهم", "number": 1}, {"text": "سأقنعهم", "number": 2}]}, {"side": "right", "options": [{"text": "مخلص، متأمل", "number": 3}, {"text": "يحب التحدي، رائد", "number": 1}, {"text": "تحليلي، دبلوماسي", "number": 5}, {"text": "شعبي، مؤثر", "number": 2}]}, {"side": "right", "options": [{"text": "ودود، سهل الاقتراب", "number": 3}, {"text": "حيوي، مفعم بالحيوية", "number": 5}, {"text": "جريء، مقدام", "number": 1}, {"text": "منظم، متكيف", "number": 4}]}, {"side": "right", "options": [{"text": "سلطوي، مؤثر", "number": 5}, {"text": "يحب الانتباه، الفرص الجديدة", "number": 2}, {"text": "يتجنب الصراع، مسترخي", "number": 3}, {"text": "يتبع القوانين، دبلوماسي", "number": 5}]}, {"side": "right", "options": [{"text": "مبدع، فريد", "number": 2}, {"text": "منظم عملياً، موجه للنتائج", "number": 1}, {"text": "جدير بالثقة، صادق", "number": 5}, {"text": "معايير عالية، ينظر إلى الأفضل", "number": 4}]}];
const numberToProfile = {1:"D",2:"I",3:"S",4:"C",5:"Neutral"};

const form = document.getElementById("discForm");
groups.forEach((group, i) => {
  const card = document.createElement("section");
  card.className = "group " + (group.side === "left" ? "yellow" : "white");
  card.id = "group-" + (i+1);

  const title = document.createElement("h2");
  title.textContent = "المجموعة " + (i+1);
  card.appendChild(title);

  group.options.forEach((opt, j) => {
    const label = document.createElement("label");
    label.className = "option";
    label.innerHTML = `<input type="radio" name="g${i+1}" value="${opt.number}"><span>${opt.text}</span>`;
    card.appendChild(label);
  });
  form.appendChild(card);
});

function updateProgress() {
  let answered = 0;
  for (let i=1;i<=24;i++) {
    if (document.querySelector(`input[name="g${i}"]:checked`)) answered++;
  }
  document.getElementById("progress").textContent = `تمت الإجابة على ${answered} من 24`;
}
form.addEventListener("change", updateProgress);

document.getElementById("submitBtn").addEventListener("click", () => {
  const error = document.getElementById("error");
  error.style.display = "none";

  for (let i=1;i<=24;i++) {
    if (!document.querySelector(`input[name="g${i}"]:checked`)) {
      error.textContent = `من فضلك اختاري إجابة في المجموعة ${i}.`;
      error.style.display = "block";
      document.getElementById("group-"+i).scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
  }

  const scores = {D:0,I:0,S:0,C:0,Neutral:0};
  for (let i=1;i<=24;i++) {
    const n = Number(document.querySelector(`input[name="g${i}"]:checked`).value);
    scores[numberToProfile[n]]++;
  }

  document.getElementById("dScore").textContent = scores.D;
  document.getElementById("iScore").textContent = scores.I;
  document.getElementById("sScore").textContent = scores.S;
  document.getElementById("cScore").textContent = scores.C;
  document.getElementById("neutralScore").textContent = scores.Neutral;

  const ranked = ["D","I","S","C"].sort((a,b) => scores[b]-scores[a]);
  const max = scores[ranked[0]];
  const tops = ranked.filter(x => scores[x] === max);

  document.getElementById("mainResult").textContent =
    tops.length === 1
      ? `النمط الأعلى في نتيجتك هو: ${tops[0]}`
      : `هناك تعادل في أعلى نتيجة بين: ${tops.join(" و ")}`;

  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
});
</script>
</body>
</html>
